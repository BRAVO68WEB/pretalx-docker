# Edge proxy for the pretalx container.
# The pretalx-public volume is mounted at /public (static/ and media/).
# This server speaks HTTP. Terminate TLS here, or publish the port on
# 127.0.0.1 and terminate TLS in a proxy in front of this one.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 100m;
    absolute_redirect off;

    # Docker embedded DNS, so a recreated pretalx container is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. {
        deny all;
    }

    # User uploads. Always download them. HTML, SVG, and JavaScript are
    # served as text/plain so the browser will not execute them.
    location ~* ^/media/.+\.(?:html?|shtml|svgz?|js|mjs|xhtml)$ {
        root /public;
        types { }
        default_type text/plain;
        expires 7d;
        access_log off;
        add_header Content-Disposition "attachment" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        root /public;
        autoindex off;
        expires 7d;
        access_log off;
        add_header Content-Disposition "attachment" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        root /public;
        autoindex off;
        expires 365d;
        access_log off;
        add_header Cache-Control "public";
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        set $pretalx_upstream pretalx;
        proxy_pass http://$pretalx_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}
